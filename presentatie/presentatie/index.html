# Onderwerp

- Mijn interesse's liggen bij dingen die ik graag in mijn vrije tijd doe, en wat ik met mijn vrienden kan doen/mee over kan praten.

- Als opties hiervoor had ik voetbal als sport, of games spelen op mijn nintendo.

- Ik vind het dus leuk en ook belangrijk dat je met vrienden of andere mensen die je gewoon ontmoet, over je hobby's en passies kan praten, en ik wil mijn onderwerp dus ook hierop baseren, omdat ik het leuk vind en ik er al direct veel vanaf weet.

- Ik heb dus gekozen voor het onderwerp: "Nintendo".

# Introtekst

Ik heb Nintendo gekozen omdat mijn passie bij gamen ligt. 
In mijn Digital Garden wil ik een tijdlijn van alle Nintendo-generaties en -era's, consoles en games, met de top 3 franchises: Mario, Zelda en Pokémon. 
Nintendo is voor iedereen en brengt mensen samen door speelplezier!

---

# Conclusie

Ik heb besloten om mijn onderwerp over "Nintendo" te laten gaan, omdat ik er veel over weet en het een onderwerp is waar ik veel plezier aan beleef.

Ik wil graag als idee voor mijn digital garden een tijdlijn maken van alle Nintendo-generaties en -era's, consoles en games.

Ik kan dit onderwerp opdelen in meerdere catergorieën, bijvoorbeeld: de geschiedenis, hun best/slechtste verkopende consoles/franchises en zelfs de toekomst van Nintendo.
